name: "Build"

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["*.md", ".agents/**/*.md"]
  pull_request:
    paths-ignore: ["*.md", ".agents/**/*.md"]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

jobs:
  static:
    name: "Static"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository With the History Fallow Ranks Changes By"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Setup Node.js And Dependencies"
        uses: ./.github/actions/setup

      - name: "Check Formatting"
        run: pnpm format:check

      - name: "Lint"
        run: pnpm lint

      - name: "Check Types"
        run: pnpm typecheck

      - name: "Find Unused Code"
        run: pnpm deadcode

      - name: "Check Code Health"
        run: pnpm health

      - name: "Check Feature Boundaries"
        run: pnpm architecture

  unit:
    name: "Unit Tests"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Node.js And Dependencies"
        uses: ./.github/actions/setup

      - name: "Run Unit Tests"
        run: pnpm test:unit --reporter=default --reporter=junit --outputFile.junit=reports/unit.xml

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-unit
          path: reports/

  artifact:
    name: "Artifact Tests"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Node.js And Dependencies"
        uses: ./.github/actions/setup

      - name: "Build Site And Run Artifact Tests"
        run: pnpm test:artifact --reporter=default --reporter=junit --outputFile.junit=reports/artifact.xml

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-artifact
          path: reports/

  e2e:
    name: "End-to-End Tests"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Node.js And Dependencies"
        uses: ./.github/actions/setup

      - name: "Find Playwright Version"
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: "Restore Chromium And Firefox For This Playwright"
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox

      - name: "Install Chromium And Firefox"
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install --with-deps chromium firefox

      # The cache holds the browsers, not the system libraries they need
      - name: "Install The Browsers' System Dependencies"
        if: ${{ steps.browsers.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium firefox

      - name: "Build Site And Run End-to-End Tests"
        run: pnpm test:e2e

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e
          path: reports/

      - name: "Upload Screenshots And Traces Of Failed Tests"
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/

  image:
    name: "Image"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      IMAGE: "localhost/xpdustry-website"
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Build Image"
        run: podman build --tag "$IMAGE:$GITHUB_SHA" .

      - name: "Serve A Page, A Translation And The Sitemap From The Image"
        run: |
          podman run --detach --name smoke --publish 3000:3000 --env XPD_DISABLE_STATUS=1 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              for path in / /fr /sitemap.xml; do
                curl --silent --show-error --fail --output /dev/null "http://127.0.0.1:3000$path" || { podman logs smoke; exit 1; }
              done
              exit 0
            fi
            [ "$(podman inspect --format '{{.State.Running}}' smoke)" = true ] || break
            sleep 1
          done
          podman logs smoke
          exit 1

  event-file:
    name: "Event File"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Upload Event File"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-file
          path: ${{ github.event_path }}
